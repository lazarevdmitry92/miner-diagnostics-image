name: Build and verify sustained GPU calibration
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/lazarevdmitry92/miner-diagnostics-image:calibration-20261006
    steps:
      - name: Download approved diagnostic build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download calibration-20261006 --repo lazarevdmitry92/miner-diagnostics-image --pattern build-context.tar.gz --pattern smoke_runtime.py
          echo "448e505d48e22fc91b56ca9eb0cbfa441a4996b7f5e0fb42f2a1538779186b5c  build-context.tar.gz" | sha256sum -c -
          echo "4a1f08fd1abad4b62cf1752d4d55bab490e6bfcfdac3a0a9cdc7eb176870f581  smoke_runtime.py" | sha256sum -c -
          mkdir context
          tar xzf build-context.tar.gz -C context
      - name: Build runtime with OpenSSH
        run: docker build --platform linux/amd64 -f context/bench/Dockerfile.calibration -t "$IMAGE" context
      - name: Verify SSH and autonomous archive without GPU or HTTP access
        run: python3 smoke_runtime.py "$IMAGE"
      - name: Publish verified runtime
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u lazarevdmitry92 --password-stdin
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}'
      - name: Retain verification result
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke
          path: runtime-smoke.json
