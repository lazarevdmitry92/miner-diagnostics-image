name: Build and verify randomized Pearl diagnostic pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/lazarevdmitry92/miner-diagnostics-image:pearl-batchfix-20261006
    steps:
      - name: Download approved diagnostic build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pearl-batchfix-20261006 --repo lazarevdmitry92/miner-diagnostics-image --pattern build-context.tar.gz --pattern smoke_runtime_v2.py
          echo "6542c7e063362aff439cda47f77e0ca2338ff3d3daa907dbfdcf0d9af7212b70  build-context.tar.gz" | sha256sum -c -
          echo "c698f2dde73cdaf349889acf0c9023ac14a417b4bdb683cd76ea472b71526c33  smoke_runtime_v2.py" | sha256sum -c -
          mkdir context
          tar xzf build-context.tar.gz -C context
      - name: Build runtime with OpenSSH
        run: docker build --platform linux/amd64 -f context/bench/Dockerfile.pearl-batchfix -t "$IMAGE" context
      - name: Verify SSH and autonomous archive without GPU or HTTP access
        run: python3 smoke_runtime_v2.py "$IMAGE"
      - name: Publish verified runtime
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u lazarevdmitry92 --password-stdin
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}'
      - name: Retain verification result
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke
          path: runtime-smoke.json
