name: Publish prebuilt diagnostic image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: [self-hosted, miner-image-publisher-20261005]
    timeout-minutes: 10
    steps:
      - name: Download and verify archive
        run: |
          curl -fL --max-time 120 https://github.com/lazarevdmitry92/miner-diagnostics-image/releases/download/runtime-20261005/image.tar -o image.tar
          echo "969fa272e34c9f06df9d3240bae067de5168b01cb5d8776eb455fb53dae60909  image.tar" | sha256sum -c -
      - name: Publish verified archive
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          DOCKER_CONFIG: ${{ runner.temp }}/diagnostic-registry-auth
        run: |
          set -eu
          CRANE=/home/aura/pilots/miner_diagnostics_build_20261005/publisher/crane
          mkdir -p "$DOCKER_CONFIG"
          trap 'rm -f "$DOCKER_CONFIG/config.json"' EXIT
          printf '%s' "$REGISTRY_TOKEN" | "$CRANE" auth login ghcr.io -u lazarevdmitry92 --password-stdin
          "$CRANE" push image.tar ghcr.io/lazarevdmitry92/miner-diagnostics-image:runtime-20261005
          "$CRANE" digest ghcr.io/lazarevdmitry92/miner-diagnostics-image:runtime-20261005
