name: Build and verify targeted Pearl mechanism diagnostic pilot
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/lazarevdmitry92/miner-diagnostics-image:pearl-mechanism-20261006
    steps:
      - name: Download approved diagnostic build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pearl-mechanism-20261006 --repo lazarevdmitry92/miner-diagnostics-image --pattern build-context.tar.gz --pattern smoke_runtime_v2.py
          echo "cc3fc8c743497035c186d4dddca074119300a3f16e5f1aebc7da7baf3e69fbb3  build-context.tar.gz" | sha256sum -c -
          echo "5288b07722f160e91c13ca25aac9d5230048268db532799a91a403de91a39d6a  smoke_runtime_v2.py" | sha256sum -c -
          mkdir context
          tar xzf build-context.tar.gz -C context
      - name: Build runtime with OpenSSH
        run: docker build --platform linux/amd64 -f context/bench/Dockerfile.pearl-mechanism -t "$IMAGE" context
      - name: Verify SSH and autonomous archive without GPU or HTTP access
        run: |
          python3 smoke_runtime_v2.py "$IMAGE" geometry
          python3 smoke_runtime_v2.py "$IMAGE" dispatch
      - name: Publish verified runtime
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u lazarevdmitry92 --password-stdin
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}'
      - name: Retain verification result
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke
          path: runtime-smoke-*.json
