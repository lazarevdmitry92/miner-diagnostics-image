name: Build and verify autonomous diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/lazarevdmitry92/miner-diagnostics-image:autonomous-20261005
    steps:
      - name: Download approved diagnostic build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download autonomous-20261005 --repo lazarevdmitry92/miner-diagnostics-image --pattern build-context.tar.gz --pattern smoke_runtime.py
          echo "0696330f70871fd0014c7c969ec70902be9582a2047e2287c0584320296f33b8  build-context.tar.gz" | sha256sum -c -
          echo "3dd1a786ed3356a2cc23427e271ddc6912e483612a3672975e66e2dd25a7d91c  smoke_runtime.py" | sha256sum -c -
          mkdir context
          tar xzf build-context.tar.gz -C context
      - name: Build runtime with OpenSSH
        run: docker build --platform linux/amd64 -f context/bench/Dockerfile.runtime -t "$IMAGE" context
      - name: Verify SSH and autonomous archive without GPU or HTTP access
        run: python3 smoke_runtime.py "$IMAGE"
      - name: Publish verified runtime
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u lazarevdmitry92 --password-stdin
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}'
      - name: Retain verification result
        uses: actions/upload-artifact@v4
        with:
          name: runtime-smoke
          path: runtime-smoke.json
