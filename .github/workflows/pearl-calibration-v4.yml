name: Publish Pearl calibration runtime v4
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: ghcr.io/lazarevdmitry92/miner-diagnostics-image:pearl-calibration-v4-20261007
    steps:
      - name: Download approved runtime-only context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download pearl-calibration-v4-20261007 --repo lazarevdmitry92/miner-diagnostics-image --pattern diagnostic-context.tar
          echo "03f1eb6bc0ebcf2039c10cae755092c7c7aea6b21cffff74ead2ee26de4dd237  diagnostic-context.tar" | sha256sum -c -
          mkdir context
          tar xf diagnostic-context.tar -C context
      - name: Build and smoke without GPU
        run: |
          docker build --platform linux/amd64 -f context/bench/Dockerfile.pearl-calibration -t "$IMAGE" context
          docker run --rm --entrypoint /opt/diagnostics/pearl_calibration_runtime "$IMAGE" --help
          docker run --rm --entrypoint python3 "$IMAGE" /app/tools/run_pearl_calibration.py --help
          docker run --rm --entrypoint sh "$IMAGE" -c 'ssh-keygen -A && /usr/sbin/sshd -t -f /etc/diagnostics/sshd_config'
          docker run --rm --entrypoint /opt/diagnostics/pearl_calibration_runtime "$IMAGE" --describe
          docker run --rm --entrypoint /opt/diagnostics/pearl_calibration_runtime "$IMAGE" --self-test
      - name: Publish diagnostic runtime
        env:
          REGISTRY_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u lazarevdmitry92 --password-stdin
          docker push "$IMAGE"
          docker inspect "$IMAGE" --format '{{json .RepoDigests}}'
